<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Sanza — Prototype E — Informer un financeur</title><link rel="stylesheet" href="parcours.css">
<style>
body{background:#101828;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.pbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:#101828;color:#fff;flex-shrink:0}
.pbar b{font:600 14px var(--head)}
.pbar .q{font-size:12px;color:rgba(255,255,255,.55);max-width:420px}
.pstep{font:500 12.5px var(--sans);color:rgba(255,255,255,.75)}
.pbtn{height:34px;padding:0 16px;border-radius:6px;font:600 13px var(--sans);display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.pbtn.next{background:var(--orange);color:#fff}
.pbtn.prev{background:rgba(255,255,255,.1);color:#fff}
.pframe{flex:1;border:0;width:100%;background:#fff}
.pnote{padding:9px 22px;background:#1D2433;color:rgba(255,255,255,.75);font-size:12.5px;flex-shrink:0}
.spring{flex:1}
</style></head>
<body>
<div class="pbar">
<b>Prototype E — Informer un financeur</b><span class="pstep" id="step"></span>
<span class="spring"></span><span class="q">Test : le fondateur comprend-il pourquoi les indicateurs changent selon l'instrument et le financeur ?</span>
<span class="pbtn prev" onclick="go(-1)">← Précédent</span>
<span class="pbtn next" onclick="go(1)">Étape suivante →</span>
</div>
<iframe class="pframe" id="frame"></iframe>
<div class="pnote" id="note"></div>
<script>
const steps = [["46-liste-mises-a-jour.html","Mises à jour","L'historique par audience et instrument — chaque publication est un instantané."],["47-maj-audience.html","Choisir Dette + DFI","Le choix de l'audience modifie immédiatement la structure proposée."],["48-maj-indicateurs.html","Indicateurs combinés","Dette + DFI : capacité de remboursement + impact, gouvernance et ESG. Retrait de la dette totale (sensible)."],["49-maj-verification.html","Prévisualiser","Le fondateur voit exactement la mise à jour que recevra Proparco."],["50-maj-publiee.html","Publier","Version figée V1, consultations journalisées, correction = V2."]];
let i = 0;
function render() {
  document.getElementById('frame').src = steps[i][0];
  document.getElementById('step').textContent = 'Étape ' + (i + 1) + ' / ' + steps.length + ' — ' + steps[i][1];
  document.getElementById('note').textContent = steps[i][2];
}
function go(d) { i = Math.max(0, Math.min(steps.length - 1, i + d)); render(); }
render();
</script>
</body>
</html>
